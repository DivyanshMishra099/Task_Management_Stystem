<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Task Manager Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

body{

font-family:'Inter',sans-serif;

background:
radial-gradient(circle at 20% 20%, #1e3c72, transparent),
radial-gradient(circle at 80% 80%, #2a5298, transparent),
#0f172a;

min-height:100vh;

color:white;

}


/* NAVBAR */

.navbar{

background: rgba(255,255,255,0.05);

backdrop-filter: blur(20px);

}


/* DASHBOARD CARD */

.dashboard{

margin-top:40px;

background: rgba(255,255,255,0.06);

backdrop-filter: blur(20px);

border-radius:20px;

padding:25px;

box-shadow:0 20px 50px rgba(0,0,0,0.6);

transform-style: preserve-3d;

transition:0.4s;

}


.dashboard:hover{

transform: rotateX(2deg) rotateY(-2deg) scale(1.01);

}


/* TABLE */

.table{

color:white;

}

.table thead{

background: rgba(255,255,255,0.08);

}

.table tbody tr{

transition:0.3s;

}

.table tbody tr:hover{

background: rgba(255,255,255,0.08);

transform: scale(1.01);

}


/* STATUS BADGES */

.status{

display:inline-flex;

align-items:center;

gap:6px;

padding:6px 14px;

border-radius:50px;

font-size:13px;

font-weight:500;

white-space:nowrap;

}

.pending{

background:#f59e0b;

}

.progress{

background:#0ea5e9;

}

.completed{

background:#22c55e;

}


/* ACTION ICON BUTTONS */

.action-btn{

width:36px;

height:36px;

display:inline-flex;

align-items:center;

justify-content:center;

border-radius:10px;

margin-right:6px;

font-size:16px;

transition:0.3s;

}


.edit-btn{

background:#2563eb;

color:white;

}

.edit-btn:hover{

background:#1d4ed8;

transform:translateY(-3px) scale(1.1);

box-shadow:0 10px 20px rgba(37,99,235,0.5);

}


.delete-btn{

background:#dc2626;

color:white;

}

.delete-btn:hover{

background:#b91c1c;

transform:translateY(-3px) scale(1.1);

box-shadow:0 10px 20px rgba(220,38,38,0.5);

}


/* FLOATING ADD BUTTON */

.add-btn{

position:fixed;

bottom:30px;

right:30px;

width:60px;

height:60px;

border-radius:50%;

background:linear-gradient(45deg,#06b6d4,#3b82f6);

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

color:white;

box-shadow:0 10px 30px rgba(0,0,0,0.5);

transition:0.4s;

text-decoration:none;

}

.add-btn:hover{

transform:rotate(90deg) scale(1.1);

}


/* MODAL FIX */

.modal-content{

background:#0f172a;

color:white;

border-radius:15px;

}
.btn-new-task{

background: linear-gradient(135deg,#06b6d4,#3b82f6);

border:none;

color:white;

padding:10px 18px;

border-radius:10px;

font-weight:600;

box-shadow:0 6px 20px rgba(59,130,246,0.35);

transition:all 0.25s ease;

}

.btn-new-task:hover{

transform: translateY(-3px) scale(1.03);

box-shadow:0 10px 25px rgba(59,130,246,0.5);

color:white;

}

</style>

</head>

<body>


<nav class="navbar navbar-dark px-4">

<span class="navbar-brand mb-0 h4">

<i class="bi bi-check2-square"></i>

Task Manager

<div class="d-flex justify-content-between align-items-center mb-4">

    <!-- Left: Title -->
    <div>
        <h2 class="fw-bold text-light mb-0">
            <i class="bi bi-kanban-fill text-info"></i>
            Task Dashboard
        </h2>
        <small class="text-secondary">
            Manage and track your tasks efficiently
        </small>
    </div>

    <!-- Right: New Task Button -->
    <a th:href="@{/new}" class="btn btn-new-task">
        <i class="bi bi-plus-lg"></i>
        New Task
    </a>

</div>

</span>

</nav>


<div class="container">


<div class="dashboard">


<h3 class="mb-4">

Dashboard

</h3>


<div class="table-responsive">

<table class="table align-middle">


<thead>

<tr>

<th>ID</th>

<th>Title</th>

<th>Description</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>


<tbody>


<tr th:each="task : ${listTasks}">


<td th:text="${task.id}"></td>


<td th:text="${task.title}"></td>


<td th:text="${task.description}"></td>


<td>


<span th:if="${task.status=='Pending'}" class="status pending">

<i class="bi bi-clock"></i>

Pending

</span>


<span th:if="${task.status=='In Progress'}" class="status progress">

<i class="bi bi-gear-fill"></i>

In&nbsp;Progress

</span>


<span th:if="${task.status=='Completed'}" class="status completed">

<i class="bi bi-check-circle-fill"></i>

Completed

</span>


</td>


<td>


<a th:href="@{'/edit/' + ${task.id}}"

class="action-btn edit-btn">

<i class="bi bi-pencil-fill"></i>

</a>


<button class="action-btn delete-btn"

data-bs-toggle="modal"

data-bs-target="#deleteModal"

th:attr="data-id=${task.id}">

<i class="bi bi-trash-fill"></i>

</button>


</td>


</tr>


</tbody>


</table>

</div>


</div>

</div>



<!-- FLOAT BUTTON -->

<a href="/new" class="add-btn">

<i class="bi bi-plus"></i>

</a>



<!-- DELETE MODAL -->

<div class="modal fade" id="deleteModal">

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">


<div class="modal-header">

<h5>Confirm Delete</h5>

<button class="btn-close btn-close-white"

data-bs-dismiss="modal">

</button>

</div>


<div class="modal-body">

Are you sure you want to delete this task?

</div>


<div class="modal-footer">

<button class="btn btn-secondary"

data-bs-dismiss="modal">

Cancel

</button>


<a id="confirmDelete"

class="btn btn-danger">

Delete

</a>

</div>


</div>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<script>

const deleteModal=document.getElementById('deleteModal');

deleteModal.addEventListener('show.bs.modal',function(event){

const button=event.relatedTarget;

const id=button.getAttribute('data-id');

document.getElementById('confirmDelete').href='/delete/'+id;

});

</script>


</body>

</html>
