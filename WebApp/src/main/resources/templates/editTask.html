<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Task</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
          rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

<style>

body{
    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at 10% 10%, #0f2027, transparent),
    radial-gradient(circle at 90% 90%, #2c5364, transparent),
    #020617;

    height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;
}

/* Card */

.form-card{

background: rgba(255,255,255,0.08);

backdrop-filter: blur(20px);

border-radius:20px;

padding:40px;

width:520px;

box-shadow:0 20px 50px rgba(0,0,0,0.6);

transform-style: preserve-3d;

transition:0.4s;

}

.form-card:hover{

transform: rotateX(3deg) rotateY(-3deg) scale(1.01);

}

/* Inputs */

.form-control,
.form-select{

background: rgba(255,255,255,0.1);

border:none;

color:white;

}

.form-control:focus,
.form-select:focus{

background: rgba(255,255,255,0.15);

color:white;

box-shadow:none;

}

/* Update button */

.btn-update{

background: linear-gradient(45deg,#22c55e,#16a34a);

border:none;

border-radius:50px;

padding:10px;

font-weight:600;

color:white;

transition:0.3s;

}

.btn-update:hover{

transform: translateY(-2px);

box-shadow:0 10px 20px rgba(0,0,0,0.4);

}

/* Back */

.back-link{

color:#94a3b8;

text-decoration:none;

}

.back-link:hover{

color:white;

}

.task-id{

font-size:13px;

color:#94a3b8;

}
.status-dropdown{

background:#161b22;

color:#e6edf3;

border:1px solid rgba(255,255,255,0.15);

border-radius:8px;

padding:10px;

font-weight:500;

}


.status-dropdown:focus{

border-color:#3b82f6;

box-shadow:0 0 0 2px rgba(59,130,246,0.25);

background:#161b22;

color:white;

}


/* option colors */

.opt-pending{

background:#161b22;

color:#f59e0b;

}

.opt-progress{

background:#161b22;

color:#3b82f6;

}

.opt-completed{

background:#161b22;

color:#22c55e;

}

</style>

</head>
<body>


<div class="form-card">


<div class="mb-4 text-center">

<h3>
<i class="bi bi-pencil-square"></i>
Edit Task
</h3>

<p class="text-secondary">
Update your task details
</p>

<p class="task-id">
Task ID: <span th:text="${task.id}"></span>
</p>

</div>


<form th:action="@{/save}" th:object="${task}" method="post">

<!-- hidden id field REQUIRED -->
<input type="hidden" th:field="*{id}">


<div class="mb-3">

<label class="form-label">
Title
</label>

<input type="text"
class="form-control"
th:field="*{title}"
required>

</div>


<div class="mb-3">

<label class="form-label">
Description
</label>

<textarea
class="form-control"
th:field="*{description}"
rows="3"
required>
</textarea>

</div>


<div class="mb-3">

<label class="form-label text-light">Status</label>

<select class="form-select status-dropdown"
        th:field="*{status}">

    <option value="Pending" class="opt-pending">
        🟡 Pending
    </option>

    <option value="In Progress" class="opt-progress">
        🔵 In Progress
    </option>

    <option value="Completed" class="opt-completed">
        🟢 Completed
    </option>

</select>

</div>

<div class="d-grid">

<button type="submit"
class="btn btn-update">

<i class="bi bi-check2-circle"></i>
Update Task

</button>

</div>


</form>


<div class="text-center mt-3">

<a href="/"
class="back-link">

<i class="bi bi-arrow-left"></i>
Back to Dashboard

</a>

</div>


</div>


</body>
</html>
