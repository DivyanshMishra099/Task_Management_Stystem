<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create New Task</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
          rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

<style>

body{
    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at 20% 20%, #1e3c72, transparent),
    radial-gradient(circle at 80% 80%, #2a5298, transparent),
    #0f172a;

    height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;
}


/* Card */

.form-card{

background: rgba(255,255,255,0.08);

backdrop-filter: blur(20px);

border-radius:20px;

padding:40px;

width:500px;

box-shadow:0 15px 40px rgba(0,0,0,0.5);

transform-style: preserve-3d;

transition:0.4s;

}

.form-card:hover{

transform: rotateX(2deg) rotateY(-2deg);

}


/* Inputs */

.form-control,
.form-select{

background: rgba(255,255,255,0.1);

border:none;

color:white;

}

.form-control:focus,
.form-select:focus{

background: rgba(255,255,255,0.15);

color:white;

box-shadow:none;

}


/* Button */

.btn-save{

background: linear-gradient(45deg,#06b6d4,#3b82f6);

border:none;

border-radius:50px;

padding:10px;

font-weight:600;

}

.btn-save:hover{

transform: translateY(-2px);

}


/* Back */

.back-link{

color:#94a3b8;

text-decoration:none;

}

.back-link:hover{

color:white;

}
.status-dropdown{

background:#161b22;

color:#e6edf3;

border:1px solid rgba(255,255,255,0.15);

border-radius:8px;

padding:10px;

font-weight:500;

}


.status-dropdown:focus{

border-color:#3b82f6;

box-shadow:0 0 0 2px rgba(59,130,246,0.25);

background:#161b22;

color:white;

}


/* option colors */

.opt-pending{

background:#161b22;

color:#f59e0b;

}

.opt-progress{

background:#161b22;

color:#3b82f6;

}

.opt-completed{

background:#161b22;

color:#22c55e;

}

</style>

</head>
<body>


<div class="form-card">


<div class="mb-4 text-center">

<h3>

<i class="bi bi-plus-square"></i>

Create New Task

</h3>

<p class="text-secondary">

Add a new task to your manager

</p>

</div>



<form th:action="@{/save}" th:object="${task}" method="post">


<div class="mb-3">

<label class="form-label">

Title

</label>

<input type="text"

class="form-control"

th:field="*{title}"

placeholder="Enter task title"

required>

</div>



<div class="mb-3">

<label class="form-label">

Description

</label>

<textarea

class="form-control"

th:field="*{description}"

rows="3"

placeholder="Enter description"

required>

</textarea>

</div>



<div class="mb-4">

<label class="form-label">

Status

</label>

<select class="form-select status-dropdown"
        th:field="*{status}">

    <option value="Pending" class="opt-pending">
        🟡 Pending
    </option>

    <option value="In Progress" class="opt-progress">
        🔵 In Progress
    </option>

    <option value="Completed" class="opt-completed">
        🟢 Completed
    </option>

</select>

</div>



<div class="d-grid">

<button type="submit"

class="btn btn-save">

<i class="bi bi-check-lg"></i>

Save Task

</button>

</div>


</form>



<div class="text-center mt-3">

<a href="/"

class="back-link">

← Back to Dashboard

</a>

</div>


</div>


</body>
</html>
